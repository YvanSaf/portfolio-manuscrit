name: CD

# Runs on every push to main: production build, sync to S3,
# CloudFront cache invalidation. Authentication uses OIDC (no AWS key
# stored as a secret), see docs/decisions/0002-oidc-vs-static-keys.md
on:
  push:
    branches: [main]

permissions:
  id-token: write # required for AssumeRoleWithWebIdentity (OIDC)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync ./dist "s3://${{ secrets.S3_BUCKET_NAME }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          # index.html is copied separately with no long term caching, so
          # visitors always get the latest version right after a deploy.
          aws s3 cp ./dist/index.html "s3://${{ secrets.S3_BUCKET_NAME }}/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"